name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Reduce el GITHUB_TOKEN a solo lectura: este workflow no necesita escribir en el repo.
permissions:
  contents: read

# Cancela corridas anteriores de la misma rama cuando llega un commit nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chatbot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check app/ --output-format github

      - name: Run pytest
        env:
          SECRET_KEY: ci-secret-key-not-for-prod
          DATABASE_URL: "mysql+aiomysql://root:root@127.0.0.1:3306/chatbot_test"
          REDIS_URL: "redis://localhost:6379/15"
        run: pytest tests/ -q --cov=app --cov-report=term-missing

  frontend-unit:
    name: Frontend unit (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Bloqueante, igual que ruff en el backend: las reglas que Next trata
      # como error (no-unused-vars, entre otras) rompen `npm run build`, y
      # antes solo se detectaban al construir la imagen en el job de E2E.
      - name: Lint with ESLint
        run: npx next lint --no-cache

      - run: npm test

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    # 20 min no alcanzaba: dos builds de Docker desde cero más, en el primer
    # run sin cache, la descarga de los modelos de embeddings en el arranque
    # del backend agotaban el tiempo antes de que el healthcheck pasara.
    timeout-minutes: 30
    needs: [backend, frontend-unit]

    steps:
      - uses: actions/checkout@v4

      - name: Create backend .env for CI
        # docker-compose.yml exige que el .env exista físicamente; no son secretos reales, solo lo mínimo para arrancar en development.
        run: |
          {
            echo "SECRET_KEY=ci-secret-key-not-for-prod-but-32-chars-long"
            echo "ENVIRONMENT=development"
            echo "DEBUG=false"
            echo "FIRST_ADMIN_EMAIL=admin@example.com"
            echo "FIRST_ADMIN_PASSWORD=ci-admin-pass-1234"
            # 127.0.0.1:3000, no solo localhost:3000: Playwright navega con
            # PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 (ver "Run Playwright
            # tests" más abajo), así que el Origin real de sus requests es
            # 127.0.0.1 - sin esta entrada, el preflight OPTIONS a rutas
            # autenticadas (ej. change-password) recibe 403 y el navegador
            # nunca llega a disparar la petición real.
            echo 'ALLOWED_ORIGINS=["http://localhost", "http://localhost:3000", "http://127.0.0.1:3000"]'
            echo "WIDGET_BASE_URL=http://localhost:8000"
          } > backend/.env

      # El entrypoint del backend descarga los modelos ONNX (embeddings) en el
      # primer arranque si el cache está vacío - sin cachear entre runs, esa
      # descarga puede agotar el tiempo disponible antes de que el healthcheck
      # pase, dejando al frontend (que depende de backend healthy) sin arrancar.
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-models-${{ hashFiles('backend/requirements.txt') }}

      - name: Prepare cache dir permissions
        # El contenedor corre como appuser (UID no root, no determinista de
        # antemano); con 777 evita un Permission denied al escribir el bind
        # mount desde el host, sin necesidad de conocer el UID exacto.
        run: mkdir -p .cache/fastembed && chmod -R 777 .cache

      - name: Bring up the stack
        # Sin estas vars, NEXT_PUBLIC_APP_URL queda en su default
        # "http://localhost" y los redirects del middleware de auth apuntan
        # a un puerto sin nada escuchando en el runner (chrome-error).
        run: |
          FRONTEND_API_URL=http://127.0.0.1:8000 \
          FRONTEND_APP_URL=http://127.0.0.1:3000 \
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait mysql redis qdrant backend frontend

      - name: Show stack logs after startup
        if: always()
        run: |
          echo "=== docker compose ps ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          echo "=== backend logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs backend --no-color
          echo "=== frontend logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs frontend --no-color

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Confirma que los puertos publicados son alcanzables desde el host
      # (curl con -4 fuerza IPv4, igual que la URL real que usa Playwright).
      # Exige 3 respuestas consecutivas, no solo una: un único curl exitoso
      # no descarta que el contenedor siga terminando de inicializar (visto
      # en CI: el healthcheck de Docker y un curl aislado pasaban, y aun así
      # el primer request real de Chromium fallaba con chrome-error).
      - name: Wait for frontend and backend to accept connections from the host
        run: |
          for url in http://127.0.0.1:8000/api/v1/health/live http://127.0.0.1:3000/login; do
            echo "Esperando $url..."
            consecutive=0
            for i in $(seq 1 40); do
              if curl -4 -sf -o /dev/null "$url"; then
                consecutive=$((consecutive + 1))
                echo "  $url respondió (intento $i, ${consecutive}/3 consecutivas)."
                if [ "$consecutive" -ge 3 ]; then
                  break
                fi
              else
                consecutive=0
              fi
              if [ "$i" -eq 40 ]; then
                echo "  ERROR: $url no respondió de forma estable tras 40 intentos."
                docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
                exit 1
              fi
              sleep 1
            done
          done

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
        env:
          # 127.0.0.1 explícito, no "localhost": el runner de GitHub Actions
          # resuelve "localhost" a IPv6 (::1) antes que a IPv4 y Chromium (a
          # diferencia de curl, que tiene fallback) falla en seco con
          # ERR_CONNECTION_REFUSED si nada escucha en esa interfaz - Docker
          # solo publica el puerto en IPv4 salvo configuración explícita.
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          # Mismo admin que "Create backend .env for CI" siembra en el primer
          # arranque del backend - sin esto, los specs gated con
          # test.skip(!E2E_USER || !E2E_PASS) nunca corren en CI (la mayoría
          # de la suite: todo lo que requiere una sesión autenticada).
          E2E_USER: admin@example.com
          E2E_PASS: ci-admin-pass-1234

      - name: Show stack logs after Playwright
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          echo "=== backend logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs backend --no-color
          echo "=== frontend logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs frontend --no-color

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
